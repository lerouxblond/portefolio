<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ethan Houziaux — Développeur Full Stack</title>
    <meta name="description" content="Portfolio d'Ethan Houziaux, développeur full stack à Rouen, entre jeux vidéo et web. En recherche d'une alternance Bac+5." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#FFF8F0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#120E0B" media="(prefers-color-scheme: dark)" />
    <meta property="og:title" content="Ethan Houziaux — Développeur Full Stack" />
    <meta property="og:description" content="Entre jeux vidéo et web. React, TypeScript, Go, PostgreSQL." />
    <meta property="og:locale" content="fr_FR" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <script>
      // Applique le thème mémorisé avant le premier rendu (pas de flash).
      ;(function () {
        var root = document.documentElement
        try {
          var t = localStorage.getItem('theme')
          if (t === 'light' || t === 'dark') root.dataset.theme = t
        } catch (e) {}
        // Intro (rideau) : posée avant le premier rendu pour que la page n'apparaisse pas avant lui.
        // Jamais avec « réduire les animations » ; retirée d'office si le script de la page ne démarre pas.
        try {
          if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            root.classList.add('intro')
            if ('scrollRestoration' in history) history.scrollRestoration = 'manual'
            setTimeout(function () {
              if (!window.__introStarted) root.classList.remove('intro')
            }, 5000)
          }
        } catch (e) {}
      })()
    </script>
    <style>
      /* Rideau d'intro : couleurs en dur (la feuille de styles peut arriver après le premier rendu). */
      #intro {
        --intro-bg: #fff8f0;
        display: none;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) #intro {
          --intro-bg: #120e0b;
        }
      }
      :root[data-theme='dark'] #intro {
        --intro-bg: #120e0b;
      }
      html.intro {
        overflow: hidden;
        scrollbar-gutter: stable;
      }
      html.intro #intro {
        display: block;
        position: fixed;
        inset: 0;
        z-index: 200;
        cursor: pointer;
      }
      .intro__curtain {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: var(--intro-bg);
      }
    </style>
    <noscript><style>html.intro { overflow: auto; } #intro { display: none !important; }</style></noscript>
  </head>
  <body>
    <div id="intro" aria-hidden="true">
      <div class="intro__curtain">
        <span class="intro__edge"></span>
        <div class="intro__mark"></div>
        <span class="intro__skip">cliquer pour passer</span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
